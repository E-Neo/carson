[package]
name = "carson"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "carson"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["json", "query"] }
carson-api = { path = "crates/carson-api" }
carson-host = { path = "crates/carson-host" }
clap = { version = "4", features = ["derive", "env"] }
hyper = "1"
hyper-util = "0.1"
include_dir = "0.7"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util", "sync", "macros"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
toml = "1.1"
http-body-util = "0.1"
uuid = { workspace = true, features = ["v4"] }
base64 = "0.23.1"

[build-dependencies]
serde_json = "1"

[workspace]
resolver = "3"
members = [".", "crates/carson-agent", "crates/carson-tools", "crates/carson-host", "crates/carson-api", "crates/carson-ui", "crates/carson-shell"]

[workspace.package]
version = "0.1.0"
edition = "2024"

# Embedded wasm (agent + tools) is always built optimized so it precompiles to
# a small .cwasm and loads fast at startup, regardless of the host profile.
[profile.wasm]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
carson-host = { path = "crates/carson-host" }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util", "sync", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v5"] }
wasmtime = "48"
wasmtime-wasi = "48"
