[package]
name = "carson"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "carson"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["json", "query"] }
carson-api = { path = "crates/carson-api" }
carson-host = { path = "crates/carson-host" }
clap = { version = "4", features = ["derive", "env"] }
include_dir = "0.7"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util", "sync", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
toml = "1.1"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
serde_json = "1"

[workspace]
resolver = "3"
members = [".", "crates/carson-agent", "crates/carson-tools", "crates/carson-host", "crates/carson-api", "crates/carson-ui"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
carson-host = { path = "crates/carson-host" }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util", "sync", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
wasmtime = "47"
wasmtime-wasi = "47"