[server]
bind = "127.0.0.1:8000"
api_key = ""

[default_model]
provider = "mock"
model = "mock"

[providers.mock]
driver = "echo"
model = "mock"

[tools.time]
description = "Return the current unix time in milliseconds"

[tools.echo]
description = "Echo back the provided arguments"

[agents.coder]
instances = 1
system_prompt = "You are a coding agent."
model = "mock"
max_history_messages = 40

[agents.coder.capabilities]
tools = ["time", "echo"]

[agents.researcher]
instances = 1
system_prompt = "You are a research assistant."
model = "mock"
max_history_messages = 40

[agents.researcher.capabilities]
tools = ["time"]
